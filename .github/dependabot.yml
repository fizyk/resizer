version: 2
updates:
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: daily
    time: "05:00"
  open-pull-requests-limit: 1
  cooldown:
    default-days: 7
- package-ecosystem:  github-actions
  directory: "/"
  schedule:
    interval: daily
    time: "03:00"
  open-pull-requests-limit: 1
  cooldown:
    default-days: 7
  groups:
    fizyk-actions-reuse:
      patterns:
      - "fizyk/actions-reuse/*"
- package-ecosystem: pre-commit
  directory: "/"
  schedule:
    interval: daily
    time: "05:05"
  open-pull-requests-limit: 1
  cooldown:
    default-days: 7
